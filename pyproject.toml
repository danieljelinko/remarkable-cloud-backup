[project]
name = "remarkable-cloud-backup"
version = "0.1.0"
description = "Bulletproof reMarkable cloud library backup tool"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.104.0",
    "rmc>=0.3.0",
]

[project.optional-dependencies]
inspect = [
    "anthropic>=0.104.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.16.0",
]

[tool.ruff.lint]
ignore = ["I001", "ISC004", "FURB167"]   # house style: see .ruler/1007_ruff_linting.md
